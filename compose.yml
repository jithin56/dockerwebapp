version: "3.9"

services:
  devopsdb:
    image: shaikmustafa/automation:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 3
    networks:
      - mynetwork
    volumes:
      - mysql-data:/var/lib/mysql

  application:
    image: shaikmustafa/automation:app
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
volumes:
  mysql-data:
