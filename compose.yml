version: "3.9"

services:
  devopsdb:
    image: jithin56/ekswebapp:dbimage-34-33-32-31-30-29-28
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork


  application:
    image: jithin56/ekswebapp:appimage-34-33-32-31-30-29-28
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay

